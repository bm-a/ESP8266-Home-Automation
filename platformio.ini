; ESP8266 Home Automation v1.0 — PlatformIO project
; env:esp12e = device firmware | env:native = host unit tests (Unity)

[platformio]
default_envs = esp12e

[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags =
  -DRELAY_ACTIVE_LOW=1
  -DDEVICE_NAME=\"esp-home\"
lib_deps =
  tzapu/WiFiManager@^2.0.17
  arduino-libraries/NTPClient@^3.2.1
  paulstoffregen/Time@^1.6.1

[env:native]
platform = native
test_framework = unity
build_src_filter =
  +<logic/>
  +<common/>
  -<device/>
  -<main.cpp>
build_flags =
  -std=c++17 -Wall -Wextra
  -DUNIT_TEST=1
  -I${PROJECT_SRC_DIR}/logic
  -I${PROJECT_SRC_DIR}/common
